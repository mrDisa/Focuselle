name: Build Focuselle and deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'Focuselle/**'
      - 'scripts/**'
      - 'Tests/**'
      - 'landing/dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Run tests
        run: ./scripts/test.sh
      - name: Download verified official Sparkle SDK
        run: ./scripts/prepare-sparkle.sh --refresh
      - name: Build installer
        run: ./scripts/package-dmg.sh
      - name: Prepare release signing
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUS_UPDATE_SIGNING_KEY_B64: ${{ secrets.FOCUS_UPDATE_SIGNING_KEY_B64 }}
        run: ./scripts/prepare-ci-signing.sh
      - name: Build signed in-app update and appcast
        run: ./scripts/package-update.sh
      - name: Remove temporary signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/focuselle-signing-$GITHUB_RUN_ID"
      - name: Verify packaged app, signed update and download metadata
        run: ./scripts/verify-release.sh
      - name: Publish immutable update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-github-release.sh
      - name: Upload landing and verified installer
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
